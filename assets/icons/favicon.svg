<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Comic Shadow Base -->
  <rect x="14" y="14" width="100" height="100" rx="28" fill="#000000" />
  
  <!-- Outer Chunky Cartoon Card -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="#facc15" stroke="#000000" stroke-width="4.5" />

  <!-- Inner Vibrant Pad -->
  <rect x="18" y="18" width="84" height="84" rx="20" fill="#38bdf8" stroke="#000000" stroke-width="3.5" />

  <!-- Comic Star Sparkle Top Right -->
  <path d="M 85 22 L 87 29 L 94 31 L 87 33 L 85 40 L 83 33 L 76 31 L 83 29 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />

  <!-- Big Chunky Cartoon "J" with Code Brackets -->
  <g>
    <!-- Left Comic Angle Bracket < -->
    <path d="M 36 48 L 26 62 L 36 76" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 36 48 L 26 62 L 36 76" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Comic Angle Bracket > -->
    <path d="M 84 48 L 94 62 L 84 76" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 84 48 L 94 62 L 84 76" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Chunky Cartoon J Outline -->
    <path d="M 64 36 L 74 36 L 74 72 C 74 84 62 90 50 88 C 43 87 39 82 38 78" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Chunky Cartoon J Fill (Punchy Pink) -->
    <path d="M 64 36 L 74 36 L 74 72 C 74 84 62 90 50 88 C 43 87 39 82 38 78" fill="none" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- White Highlight -->
    <circle cx="70" cy="44" r="2.5" fill="#ffffff" />
    <circle cx="70" cy="52" r="2" fill="#ffffff" />
  </g>
</svg>
