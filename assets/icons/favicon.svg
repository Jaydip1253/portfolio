<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="3" />
  
  <!-- Ambient Inner Glow Ring -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="none" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.3" />
  
  <!-- Stylized J letter mark with code angle brackets -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M 38 46 L 26 64 L 38 82" fill="none" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Right bracket > -->
    <path d="M 90 46 L 102 64 L 90 82" fill="none" stroke="#7928ca" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Central J glyph -->
    <path d="M 68 40 L 76 40 L 76 74 C 76 86 64 92 52 90 C 46 89 42 85 40 82" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Terminal Dot Accent -->
    <circle cx="58" cy="40" r="3.5" fill="#00f2fe" />
  </g>
</svg>

