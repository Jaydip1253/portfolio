<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="accentLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bg1)" stroke="#1e293b" stroke-width="2" />

  <!-- App Window Header Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="32" width="600" height="10" fill="#0f172a" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <!-- Window Title -->
  <text x="300" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    cloudpulse-production // kubernetes-cluster-us-east
  </text>
  <circle cx="470" cy="21" r="4" fill="#10b981" filter="url(#glow1)" />
  <text x="480" y="25" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">HEALTHY</text>

  <!-- Left Sidebar Mini -->
  <rect x="16" y="58" width="48" height="304" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="40" cy="82" r="10" fill="#2563eb" />
  <rect x="30" y="112" width="20" height="4" rx="2" fill="#64748b" />
  <rect x="30" y="132" width="20" height="4" rx="2" fill="#38bdf8" />
  <rect x="30" y="152" width="20" height="4" rx="2" fill="#64748b" />
  <rect x="30" y="172" width="20" height="4" rx="2" fill="#64748b" />

  <!-- Top Metrics Cards -->
  <!-- Card 1: CPU -->
  <g transform="translate(80, 58)">
    <rect width="155" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">CLUSTER CPU USAGE</text>
    <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#38bdf8">34.8%</text>
    <text x="100" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">↑ -2.4%</text>
  </g>

  <!-- Card 2: Memory -->
  <g transform="translate(250, 58)">
    <rect width="155" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">RAM UTILIZATION</text>
    <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#a855f7">61.2 GB</text>
    <text x="110" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">/ 128G</text>
  </g>

  <!-- Card 3: Pods -->
  <g transform="translate(420, 58)">
    <rect width="164" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">ACTIVE PODS</text>
    <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#10b981">142/142</text>
    <circle cx="138" cy="46" r="6" fill="#10b981" opacity="0.3" />
    <circle cx="138" cy="46" r="3" fill="#10b981" />
  </g>

  <!-- Main Chart Card -->
  <g transform="translate(80, 146)">
    <rect width="504" height="216" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">
      Traffic Throughput &amp; Latency (p99)
    </text>
    
    <!-- Legend -->
    <circle cx="410" cy="22" r="3" fill="#38bdf8" />
    <text x="420" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Throughput (req/s)</text>
    <circle cx="520" cy="22" r="3" fill="#a855f7" />
    <text x="530" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Latency</text>

    <!-- Grid lines -->
    <line x1="20" y1="60" x2="484" y2="60" stroke="#1e293b" stroke-dasharray="4 4" />
    <line x1="20" y1="100" x2="484" y2="100" stroke="#1e293b" stroke-dasharray="4 4" />
    <line x1="20" y1="140" x2="484" y2="140" stroke="#1e293b" stroke-dasharray="4 4" />
    <line x1="20" y1="180" x2="484" y2="180" stroke="#1e293b" stroke-dasharray="4 4" />

    <!-- Chart Wave Area -->
    <path d="M 20 160 Q 90 90, 150 120 T 270 70 T 380 110 T 484 80 L 484 190 L 20 190 Z" fill="url(#chartGrad1)" />
    <!-- Chart Primary Stroke -->
    <path d="M 20 160 Q 90 90, 150 120 T 270 70 T 380 110 T 484 80" fill="none" stroke="url(#accentLine1)" stroke-width="3" filter="url(#glow1)" />

    <!-- Secondary Line -->
    <path d="M 20 140 Q 100 170, 180 140 T 310 160 T 420 130 T 484 150" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7" />

    <!-- Active node points -->
    <circle cx="270" cy="70" r="5" fill="#00f2fe" filter="url(#glow1)" />
    <rect x="240" y="42" width="60" height="20" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="270" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">48.2k rps</text>
  </g>
</svg>
