<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Comic Shadow -->
  <rect x="14" y="14" width="576" height="356" rx="24" fill="#000000" />

  <!-- Outer Cartoon Window -->
  <rect x="8" y="8" width="576" height="356" rx="22" fill="#1e1b4b" stroke="#000000" stroke-width="5" />

  <!-- Window Header Bar (Chunky Comic Style) -->
  <path d="M 8 30 C 8 18, 18 8, 30 8 L 562 8 C 574 8, 584 18, 584 30 L 584 52 L 8 52 Z" fill="#facc15" stroke="#000000" stroke-width="5" />

  <!-- Window Buttons (Big Cartoon Candies) -->
  <circle cx="34" cy="30" r="9" fill="#ef4444" stroke="#000000" stroke-width="3" />
  <circle cx="60" cy="30" r="9" fill="#f59e0b" stroke="#000000" stroke-width="3" />
  <circle cx="86" cy="30" r="9" fill="#10b981" stroke="#000000" stroke-width="3" />

  <!-- Window Title Tag -->
  <rect x="180" y="18" width="240" height="26" rx="13" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="300" y="36" font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    ☁️ CloudPulse Control Hub
  </text>

  <!-- Cute Live Status Sticker -->
  <g transform="translate(450, 16) rotate(4)">
    <rect width="115" height="26" rx="8" fill="#4ade80" stroke="#000000" stroke-width="3" />
    <text x="57" y="18" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">⚡ 99.9% UPTIME</text>
  </g>

  <!-- Left: Cute Server Robot Mascot -->
  <g transform="translate(30, 75)">
    <!-- Shadow -->
    <rect x="6" y="6" width="160" height="265" rx="18" fill="#000000" />
    <!-- Body -->
    <rect x="0" y="0" width="160" height="265" rx="16" fill="#38bdf8" stroke="#000000" stroke-width="4.5" />

    <!-- Cute Robot Antenna -->
    <line x1="80" y1="0" x2="80" y2="-22" stroke="#000000" stroke-width="4" />
    <circle cx="80" cy="-24" r="8" fill="#f43f5e" stroke="#000000" stroke-width="3" />

    <!-- Robot Face Screen -->
    <rect x="20" y="24" width="120" height="80" rx="14" fill="#0f172a" stroke="#000000" stroke-width="3.5" />
    <!-- Happy Robot Glowing Eyes -->
    <circle cx="50" cy="58" r="10" fill="#4ade80" />
    <circle cx="47" cy="55" r="3" fill="#ffffff" />
    <circle cx="90" cy="58" r="10" fill="#4ade80" />
    <circle cx="87" cy="55" r="3" fill="#ffffff" />
    <!-- Robot Happy Mouth -->
    <path d="M 60 80 Q 70 90 80 80" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round" />

    <text x="80" y="130" font-family="'Fredoka', sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">BOT BOT-01</text>
    <text x="80" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">Server Cluster A</text>

    <!-- Gauge bars -->
    <rect x="20" y="168" width="120" height="20" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <rect x="22" y="170" width="85" height="16" rx="4" fill="#f43f5e" />
    <text x="25" y="182" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#000000">CPU 71%</text>

    <rect x="20" y="200" width="120" height="20" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
    <rect x="22" y="202" width="45" height="16" rx="4" fill="#4ade80" />
    <text x="25" y="214" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#000000">RAM 38%</text>

    <!-- Cute Heart Sticker -->
    <g transform="translate(68, 230)">
      <path d="M 12 5 C 12 0, 0 0, 0 10 C 0 17, 12 24, 12 24 C 12 24, 24 17, 24 10 C 24 0, 12 0, 12 5 Z" fill="#fb7185" stroke="#000000" stroke-width="2" />
    </g>
  </g>

  <!-- Right: Big Cartoon Analytics Panel -->
  <g transform="translate(210, 75)">
    <!-- Shadow -->
    <rect x="6" y="6" width="355" height="265" rx="18" fill="#000000" />
    <!-- Panel Body -->
    <rect x="0" y="0" width="355" height="265" rx="16" fill="#ffffff" stroke="#000000" stroke-width="4.5" />

    <text x="20" y="34" font-family="'Fredoka', sans-serif" font-size="16" font-weight="bold" fill="#000000">
      Traffic Speedometer &amp; Bursts 🚀
    </text>

    <!-- Mini Comic Badges -->
    <g transform="translate(20, 52)">
      <rect width="95" height="52" rx="10" fill="#fef08a" stroke="#000000" stroke-width="2.5" />
      <text x="10" y="22" font-family="'Fredoka', sans-serif" font-size="10" fill="#713f12">LATENCY</text>
      <text x="10" y="42" font-family="'Fredoka', sans-serif" font-size="17" font-weight="bold" fill="#000000">18 ms</text>
    </g>

    <g transform="translate(130, 52)">
      <rect width="95" height="52" rx="10" fill="#fbcfe8" stroke="#000000" stroke-width="2.5" />
      <text x="10" y="22" font-family="'Fredoka', sans-serif" font-size="10" fill="#831843">REQUESTS</text>
      <text x="10" y="42" font-family="'Fredoka', sans-serif" font-size="17" font-weight="bold" fill="#000000">54.2k/s</text>
    </g>

    <g transform="translate(240, 52)">
      <rect width="95" height="52" rx="10" fill="#bbf7d0" stroke="#000000" stroke-width="2.5" />
      <text x="10" y="22" font-family="'Fredoka', sans-serif" font-size="10" fill="#14532d">HEALTH</text>
      <text x="10" y="42" font-family="'Fredoka', sans-serif" font-size="17" font-weight="bold" fill="#000000">100% OK</text>
    </g>

    <!-- Bouncy Cartoon Chart -->
    <rect x="20" y="125" width="315" height="120" rx="12" fill="#f8fafc" stroke="#000000" stroke-width="2.5" />
    
    <!-- Cartoon Grid -->
    <line x1="20" y1="160" x2="335" y2="160" stroke="#cbd5e1" stroke-dasharray="4 4" />
    <line x1="20" y1="200" x2="335" y2="200" stroke="#cbd5e1" stroke-dasharray="4 4" />

    <!-- Wave Fill -->
    <path d="M 25 210 Q 70 140, 110 180 T 190 145 T 260 170 T 330 135 L 330 240 L 25 240 Z" fill="#bae6fd" />
    <!-- Chunky Cartoon Line -->
    <path d="M 25 210 Q 70 140, 110 180 T 190 145 T 260 170 T 330 135" fill="none" stroke="#0284c7" stroke-width="5" stroke-linecap="round" />

    <!-- Big Bouncy Point -->
    <circle cx="190" cy="145" r="9" fill="#f43f5e" stroke="#000000" stroke-width="3" />
    <circle cx="187" cy="142" r="3" fill="#ffffff" />
  </g>
</svg>
