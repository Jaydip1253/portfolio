<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="screenGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Disc -->
  <circle cx="250" cy="250" r="230" fill="url(#avatarBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Glowing Tech Rings -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" stroke-dasharray="12 16" opacity="0.4" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 20" opacity="0.3" />

  <!-- Ambient Light Cone from Screen -->
  <polygon points="170,440 330,440 380,240 120,240" fill="url(#screenGlow)" opacity="0.25" />

  <!-- Developer Character Group -->
  <g id="character">
    <!-- Back Hair / Shadow -->
    <ellipse cx="250" cy="180" rx="68" ry="74" fill="#0b0f19" />

    <!-- Shoulders / Hoodie Body -->
    <path d="M 140 460 C 140 360, 190 320, 250 320 C 310 320, 360 360, 360 460 Z" fill="url(#hoodieGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Inner Hoodie Collar / Neckline -->
    <path d="M 215 320 L 250 375 L 285 320 Z" fill="#0f172a" />
    <path d="M 250 375 L 250 450" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Neck -->
    <rect x="228" y="270" width="44" height="60" rx="10" fill="#f59e0b" />
    <!-- Neck shadow -->
    <path d="M 228 290 Q 250 310 272 290 L 272 320 L 228 320 Z" fill="#d97706" opacity="0.5" />

    <!-- Face / Head -->
    <ellipse cx="250" cy="225" rx="55" ry="62" fill="url(#faceGrad)" />

    <!-- Modern Haircut -->
    <path d="M 195 210 C 190 150, 230 135, 275 140 C 310 145, 315 175, 305 210 C 295 190, 280 180, 260 185 C 240 190, 220 180, 205 195 Z" fill="#0f172a" />
    <!-- Hair detail stroke -->
    <path d="M 220 160 Q 250 145 285 155" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

    <!-- Smart Glasses (Modern Developer Look) -->
    <g filter="url(#subtleGlow)">
      <!-- Left frame -->
      <rect x="210" y="208" width="34" height="24" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="#00f2fe" stroke-width="3" />
      <!-- Right frame -->
      <rect x="256" y="208" width="34" height="24" rx="6" fill="rgba(15, 23, 42, 0.7)" stroke="#00f2fe" stroke-width="3" />
      <!-- Bridge -->
      <line x1="244" y1="218" x2="256" y2="218" stroke="#00f2fe" stroke-width="3" />
      <!-- Glass reflection glint -->
      <line x1="214" y1="214" x2="226" y2="226" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
      <line x1="260" y1="214" x2="272" y2="226" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>

    <!-- Eyes behind glasses -->
    <ellipse cx="227" cy="220" rx="4" ry="4" fill="#0f172a" />
    <ellipse cx="273" cy="220" rx="4" ry="4" fill="#0f172a" />

    <!-- Smile / Expression -->
    <path d="M 238 254 Q 250 264 262 254" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

    <!-- Headphones / Headset -->
    <g>
      <!-- Headband -->
      <path d="M 188 210 C 188 135, 312 135, 312 210" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
      <!-- Left Ear Cup -->
      <rect x="180" y="200" width="16" height="36" rx="8" fill="#3b82f6" stroke="#1e293b" stroke-width="2" />
      <line x1="188" y1="208" x2="188" y2="228" stroke="#00f2fe" stroke-width="2" />
      <!-- Right Ear Cup -->
      <rect x="304" y="200" width="16" height="36" rx="8" fill="#8b5cf6" stroke="#1e293b" stroke-width="2" />
      <line x1="312" y1="208" x2="312" y2="228" stroke="#c084fc" stroke-width="2" />
    </g>

    <!-- Laptop in front with keyboard and glowing screen back -->
    <g>
      <!-- Laptop Base -->
      <path d="M 160 455 L 340 455 L 355 470 L 145 470 Z" fill="#334155" stroke="#475569" stroke-width="1.5" />
      <!-- Trackpad -->
      <rect x="230" y="460" width="40" height="7" rx="2" fill="#1e293b" />
      <!-- Laptop Display Back with Glowing Logo -->
      <path d="M 175 385 L 325 385 L 335 455 L 165 455 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <!-- Glowing Logo on Laptop lid -->
      <circle cx="250" cy="420" r="10" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#subtleGlow)" />
      <path d="M 246 416 L 250 420 L 254 416" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Floating Holographic Tech Badges & Code Symbols -->
  <g filter="url(#subtleGlow)">
    <!-- TS / JS Badge Left -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="56" height="36" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <text x="28" y="23" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;TS/&gt;</text>
    </g>

    <!-- React Atom Symbol Right -->
    <g transform="translate(385, 175)">
      <rect x="0" y="0" width="56" height="36" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <text x="28" y="23" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#22d3ee" text-anchor="middle">React</text>
    </g>

    <!-- Python / API Badge Left Bottom -->
    <g transform="translate(70, 310)">
      <rect x="0" y="0" width="58" height="36" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="29" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">{API}</text>
    </g>

    <!-- Cloud / Docker Badge Right Bottom -->
    <g transform="translate(370, 320)">
      <rect x="0" y="0" width="60" height="36" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="30" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Cloud</text>
    </g>
  </g>

  <!-- Glowing Particles / Sparks -->
  <circle cx="120" cy="120" r="3" fill="#00f2fe" filter="url(#subtleGlow)" />
  <circle cx="390" cy="110" r="2.5" fill="#8b5cf6" filter="url(#subtleGlow)" />
  <circle cx="100" cy="240" r="2" fill="#38bdf8" />
  <circle cx="410" cy="260" r="2.5" fill="#00f2fe" />
  <circle cx="320" cy="80" r="3" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle cx="160" cy="85" r="2" fill="#a855f7" />
</svg>

