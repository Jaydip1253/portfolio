<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <pattern id="comicDots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#38bdf8" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Offset Comic Shadow -->
  <rect x="25" y="25" width="455" height="455" rx="36" fill="#000000" />

  <!-- Main Comic Card Background -->
  <rect x="15" y="15" width="455" height="455" rx="34" fill="#1e1b4b" stroke="#000000" stroke-width="6" />

  <!-- Comic Halftone Pattern Fill -->
  <rect x="20" y="20" width="445" height="445" rx="30" fill="url(#comicDots)" />

  <!-- Sunburst Accent Backdrop Circle -->
  <circle cx="245" cy="235" r="170" fill="#facc15" stroke="#000000" stroke-width="5" />
  <circle cx="245" cy="235" r="140" fill="#fb7185" stroke="#000000" stroke-width="4" />

  <!-- Floating Cartoon Elements & Stickers -->
  <!-- Top Left: Coffee Cup Sticker -->
  <g transform="translate(45, 60) rotate(-12)">
    <rect x="0" y="0" width="55" height="50" rx="12" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
    <path d="M 12 18 L 16 42 L 39 42 L 43 18 Z" fill="#b45309" stroke="#000000" stroke-width="2.5" />
    <path d="M 43 24 C 52 24, 52 36, 42 36" fill="none" stroke="#000000" stroke-width="3" />
    <!-- Steam -->
    <path d="M 22 12 Q 20 6 24 2" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <path d="M 33 12 Q 35 6 31 2" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Top Right: Speech Bubble "Hello World!" -->
  <g transform="translate(305, 50) rotate(6)">
    <path d="M 10 10 L 140 10 C 150 10, 150 55, 140 55 L 45 55 L 25 75 L 30 55 L 10 55 C 0 55, 0 10, 10 10 Z" fill="#ffffff" stroke="#000000" stroke-width="4" />
    <text x="75" y="38" font-family="'Fredoka', 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Let's Code! 🚀</text>
  </g>

  <!-- Bottom Left: Star Sticker -->
  <g transform="translate(50, 370) rotate(15)">
    <polygon points="25,2 32,18 49,18 35,28 40,45 25,34 9,45 15,28 1,18 18,18" fill="#facc15" stroke="#000000" stroke-width="3.5" />
    <circle cx="20" cy="22" r="2.5" fill="#000000" />
    <circle cx="30" cy="22" r="2.5" fill="#000000" />
    <path d="M 22 28 Q 25 32 28 28" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Character Group -->
  <g id="cartoon-character">
    <!-- Body / Cute Chunky Hoodie -->
    <!-- Hoodie Shadow -->
    <path d="M 120 460 C 120 330, 175 300, 245 300 C 315 300, 370 330, 370 460 Z" fill="#000000" />
    <!-- Hoodie Body (Electric Cyan) -->
    <path d="M 125 455 C 125 335, 180 305, 245 305 C 310 305, 365 335, 365 455 Z" fill="#38bdf8" stroke="#000000" stroke-width="5" />
    
    <!-- Hoodie Front Pocket -->
    <path d="M 175 425 Q 245 445 315 425 L 300 455 L 190 455 Z" fill="#0284c7" stroke="#000000" stroke-width="4" />

    <!-- Hoodie Drawstrings -->
    <path d="M 225 340 L 220 395" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="220" cy="397" r="4" fill="#f43f5e" stroke="#000000" stroke-width="2" />
    <path d="M 265 340 L 270 395" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="270" cy="397" r="4" fill="#f43f5e" stroke="#000000" stroke-width="2" />

    <!-- Cute Hoodie Badge: <JD/> -->
    <rect x="290" y="350" width="46" height="24" rx="8" fill="#facc15" stroke="#000000" stroke-width="3" transform="rotate(-8 290 350)" />
    <text x="313" y="367" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle" transform="rotate(-8 290 350)">&lt;JD/&gt;</text>

    <!-- Neck -->
    <rect x="225" y="275" width="40" height="40" rx="8" fill="#fcd34d" stroke="#000000" stroke-width="4" />

    <!-- Big Round Cartoon Head -->
    <circle cx="245" cy="210" r="75" fill="#fde047" stroke="#000000" stroke-width="5" />

    <!-- Cute Rosy Cartoon Cheeks -->
    <circle cx="190" cy="230" r="14" fill="#fb7185" opacity="0.8" />
    <circle cx="300" cy="230" r="14" fill="#fb7185" opacity="0.8" />

    <!-- Cute Messy Cartoon Hair -->
    <path d="M 170 200 C 165 130, 210 110, 255 115 C 310 120, 325 155, 315 200 C 300 175, 275 160, 245 165 C 215 170, 195 165, 170 200 Z" fill="#18181b" stroke="#000000" stroke-width="5" />
    <path d="M 210 125 Q 225 95 245 120" fill="#18181b" stroke="#000000" stroke-width="4" />
    <path d="M 260 120 Q 280 98 290 130" fill="#18181b" stroke="#000000" stroke-width="4" />

    <!-- Big Chunky Cartoon Glasses -->
    <!-- Left Glass -->
    <rect x="180" y="185" width="52" height="42" rx="14" fill="#ffffff" stroke="#000000" stroke-width="5" />
    <!-- Right Glass -->
    <rect x="258" y="185" width="52" height="42" rx="14" fill="#ffffff" stroke="#000000" stroke-width="5" />
    <!-- Glasses Bridge -->
    <rect x="232" y="200" width="26" height="7" rx="3" fill="#000000" />

    <!-- Expressive Eyes & Anime Sparkles -->
    <!-- Left Eye (Big Happy Pupil) -->
    <circle cx="206" cy="206" r="14" fill="#000000" />
    <circle cx="201" cy="201" r="5" fill="#ffffff" />
    <circle cx="211" cy="211" r="2.5" fill="#ffffff" />

    <!-- Right Eye (Winking or Big Happy Pupil) -->
    <circle cx="284" cy="206" r="14" fill="#000000" />
    <circle cx="279" cy="201" r="5" fill="#ffffff" />
    <circle cx="289" cy="211" r="2.5" fill="#ffffff" />

    <!-- Big Happy Open Grin Smile -->
    <path d="M 225 242 Q 245 264 265 242 Z" fill="#be123c" stroke="#000000" stroke-width="4" />
    <!-- Tongue in smile -->
    <path d="M 233 252 Q 245 245 257 252 Q 245 264 233 252 Z" fill="#fb7185" />

    <!-- Chunky Gamer Headphones -->
    <path d="M 160 200 C 155 125, 335 125, 330 200" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" />
    <path d="M 160 200 C 155 125, 335 125, 330 200" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
    <!-- Left Ear Cushion -->
    <rect x="150" y="185" width="22" height="45" rx="10" fill="#a855f7" stroke="#000000" stroke-width="4" />
    <!-- Right Ear Cushion -->
    <rect x="318" y="185" width="22" height="45" rx="10" fill="#a855f7" stroke="#000000" stroke-width="4" />

    <!-- Chunky Cartoon Laptop (Lower in frame) -->
    <g transform="translate(145, 395)">
      <!-- Laptop Shadow -->
      <path d="M 25 10 L 175 10 L 195 65 L 5 65 Z" fill="#000000" />
      <!-- Laptop Base -->
      <path d="M 20 5 L 180 5 L 200 55 L 0 55 Z" fill="#e2e8f0" stroke="#000000" stroke-width="4.5" />
      <!-- Trackpad -->
      <rect x="75" y="32" width="50" height="18" rx="4" fill="#cbd5e1" stroke="#000000" stroke-width="2" />

      <!-- Laptop Screen Back (Facing viewer) -->
      <path d="M 35 -65 L 165 -65 L 175 5 L 25 5 Z" fill="#334155" stroke="#000000" stroke-width="4.5" />

      <!-- Laptop Stickers! -->
      <!-- Sticker 1: Glowing React atom -->
      <circle cx="100" cy="-30" r="16" fill="#38bdf8" stroke="#000000" stroke-width="2.5" />
      <text x="100" y="-25" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">⚛</text>

      <!-- Sticker 2: Pizza slice -->
      <path d="M 55 -45 L 75 -45 L 65 -20 Z" fill="#facc15" stroke="#000000" stroke-width="2" />
      <circle cx="65" cy="-38" r="2" fill="#ef4444" />
      <circle cx="62" cy="-30" r="1.5" fill="#ef4444" />

      <!-- Sticker 3: JS logo -->
      <rect x="125" y="-45" width="18" height="18" rx="4" fill="#eab308" stroke="#000000" stroke-width="2" />
      <text x="134" y="-32" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">JS</text>
    </g>
  </g>

  <!-- Sparkles & Comic Action Marks -->
  <path d="M 390 160 L 405 160 M 397 152 L 397 168" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
  <path d="M 100 170 L 115 170 M 107 162 L 107 178" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
  <circle cx="395" cy="270" r="6" fill="#4ade80" stroke="#000000" stroke-width="2" />
  <circle cx="95" cy="270" r="5" fill="#c084fc" stroke="#000000" stroke-width="2" />
</svg>
