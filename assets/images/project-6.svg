<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow6" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg6)" stroke="#1e293b" stroke-width="2" />

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="32" width="600" height="10" fill="#0f172a" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1e293b" stroke-width="1" />

  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <text x="300" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    TaskForge // Sprint 42 Board (Q4 Release)
  </text>
  <rect x="490" y="12" width="90" height="20" rx="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="535" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">SPRINT ON TRACK</text>

  <!-- 3 Kanban Columns -->
  <!-- Col 1: Backlog -->
  <g transform="translate(20, 56)">
    <rect width="170" height="304" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <rect x="12" y="12" width="8" height="8" rx="2" fill="#64748b" />
    <text x="26" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">TODO (3)</text>
    
    <!-- Card 1 -->
    <rect x="12" y="34" width="146" height="74" rx="8" fill="#1e293b" />
    <rect x="20" y="44" width="46" height="14" rx="4" fill="#3b82f6" fill-opacity="0.3" />
    <text x="43" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#60a5fa" text-anchor="middle">INFRA</text>
    <text x="20" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Upgrade Postgres v16</text>
    <circle cx="140" cy="92" r="7" fill="#8b5cf6" />
    <text x="140" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#fff" text-anchor="middle">JD</text>

    <!-- Card 2 -->
    <rect x="12" y="118" width="146" height="74" rx="8" fill="#1e293b" />
    <rect x="20" y="128" width="46" height="14" rx="4" fill="#a855f7" fill-opacity="0.3" />
    <text x="43" y="138" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc" text-anchor="middle">UI/UX</text>
    <text x="20" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Dark mode contrast audit</text>
    <circle cx="140" cy="176" r="7" fill="#ec4899" />
    <text x="140" y="179" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#fff" text-anchor="middle">EL</text>
  </g>

  <!-- Col 2: In Progress -->
  <g transform="translate(210, 56)">
    <rect width="180" height="304" rx="10" fill="#0b0f19" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="12" y="12" width="8" height="8" rx="2" fill="#3b82f6" />
    <text x="26" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">IN PROGRESS (2)</text>
    
    <!-- Active Card (Highlighted) -->
    <rect x="12" y="34" width="156" height="96" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" filter="url(#glow6)" />
    <rect x="20" y="44" width="56" height="14" rx="4" fill="#ef4444" fill-opacity="0.3" />
    <text x="48" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f87171" text-anchor="middle">P0 CRITICAL</text>
    <text x="20" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">OAuth2 Multi-Tenant Auth</text>
    
    <!-- Progress bar in card -->
    <rect x="20" y="88" width="140" height="6" rx="3" fill="#334155" />
    <rect x="20" y="88" width="105" height="6" rx="3" fill="#38bdf8" />
    <text x="20" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">75% complete</text>
    <circle cx="150" cy="112" r="7" fill="#06b6d4" />
    <text x="150" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#0f172a" font-weight="bold" text-anchor="middle">JD</text>

    <!-- Card 2 -->
    <rect x="12" y="140" width="156" height="74" rx="8" fill="#1e293b" />
    <rect x="20" y="150" width="46" height="14" rx="4" fill="#10b981" fill-opacity="0.3" />
    <text x="43" y="160" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399" text-anchor="middle">API</text>
    <text x="20" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#f1f5f9">Rate limiting middleware</text>
  </g>

  <!-- Col 3: Done -->
  <g transform="translate(410, 56)">
    <rect width="170" height="304" rx="10" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <rect x="12" y="12" width="8" height="8" rx="2" fill="#10b981" />
    <text x="26" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#34d399">DONE (6)</text>
    
    <!-- Card Done 1 -->
    <rect x="12" y="34" width="146" height="66" rx="8" fill="#1e293b" opacity="0.8" />
    <text x="20" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-decoration="line-through">
      Stripe Webhook handler
    </text>
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">✓ Merged to main</text>

    <!-- Card Done 2 -->
    <rect x="12" y="110" width="146" height="66" rx="8" fill="#1e293b" opacity="0.8" />
    <text x="20" y="131" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-decoration="line-through">
      Redis Cache layer
    </text>
    <text x="20" y="151" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">✓ Benchmark 2ms</text>
  </g>
</svg>

