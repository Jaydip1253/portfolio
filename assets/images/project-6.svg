  <circle cx="34" cy="30" r="9" fill="#f43f5e" stroke="#000000" stroke-width="3" />
  <circle cx="60" cy="30" r="9" fill="#38bdf8" stroke="#000000" stroke-width="3" />
  <circle cx="86" cy="30" r="9" fill="#4ade80" stroke="#000000" stroke-width="3" />

