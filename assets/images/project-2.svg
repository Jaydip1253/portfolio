<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Comic Shadow -->
  <rect x="14" y="14" width="576" height="356" rx="24" fill="#000000" />
  <!-- Window Base -->
  <rect x="8" y="8" width="576" height="356" rx="22" fill="#090d16" stroke="#000000" stroke-width="5" />

  <!-- Window Header Bar (Chunky Comic Pink) -->
  <path d="M 8 30 C 8 18, 18 8, 30 8 L 562 8 C 574 8, 584 18, 584 30 L 584 52 L 8 52 Z" fill="#fb7185" stroke="#000000" stroke-width="5" />

  <!-- Cartoon Window Buttons -->
  <circle cx="34" cy="30" r="9" fill="#facc15" stroke="#000000" stroke-width="3" />
  <circle cx="60" cy="30" r="9" fill="#38bdf8" stroke="#000000" stroke-width="3" />
  <circle cx="86" cy="30" r="9" fill="#4ade80" stroke="#000000" stroke-width="3" />

  <rect x="190" y="18" width="220" height="26" rx="13" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="300" y="36" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    👾 DevSync Arcade Editor
  </text>

  <!-- Left: File Explorer Comic Sidebar -->
  <g transform="translate(25, 70)">
    <rect x="5" y="5" width="125" height="270" rx="14" fill="#000000" />
    <rect width="125" height="270" rx="12" fill="#fef08a" stroke="#000000" stroke-width="4" />

    <text x="14" y="28" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#000000">📁 FILES</text>
    
    <rect x="10" y="40" width="105" height="26" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#000000">App.tsx ⭐</text>

    <text x="16" y="92" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#1e293b">📄 server.ts</text>
    <text x="16" y="118" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#1e293b">📄 sync.io</text>
    <text x="16" y="144" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#1e293b">🎨 style.css</text>

    <!-- Mini Sticker in Sidebar -->
    <g transform="translate(18, 180) rotate(-10)">
      <rect width="85" height="55" rx="10" fill="#f43f5e" stroke="#000000" stroke-width="3" />
      <text x="42" y="24" font-family="'Fredoka', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">2 PLAYERS</text>
      <text x="42" y="42" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">ONLINE 🎮</text>
    </g>
  </g>

  <!-- Right: Code Editor Canvas with Cute Avatars and Speech Bubbles -->
  <g transform="translate(170, 70)">
    <rect x="5" y="5" width="395" height="270" rx="16" fill="#000000" />
    <rect width="395" height="270" rx="14" fill="#1e293b" stroke="#000000" stroke-width="4" />

    <!-- Top Collaborative Dev Avatars -->
    <g transform="translate(20, 18)">
      <!-- Player 1: Jaydip -->
      <circle cx="20" cy="18" r="16" fill="#facc15" stroke="#000000" stroke-width="2.5" />
      <text x="20" y="22" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">JD</text>
      
      <!-- Speech bubble from Jaydip -->
      <path d="M 45 6 L 155 6 C 162 6, 162 32, 155 32 L 60 32 L 45 42 L 52 32 L 45 32 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
      <text x="100" y="22" font-family="'Fredoka', sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">"Bug fixed! 🚀"</text>

      <!-- Player 2: Partner -->
      <g transform="translate(240, 0)">
        <circle cx="20" cy="18" r="16" fill="#38bdf8" stroke="#000000" stroke-width="2.5" />
        <text x="20" y="22" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">AL</text>
        <path d="M 45 6 L 125 6 C 132 6, 132 32, 125 32 L 60 32 L 45 42 L 52 32 L 45 32 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
        <text x="85" y="22" font-family="'Fredoka', sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">"Ship it! 🔥"</text>
      </g>
    </g>

    <!-- Candy Code Lines -->
    <g transform="translate(25, 75)">
      <rect width="345" height="175" rx="10" fill="#0f172a" stroke="#000000" stroke-width="3" />

      <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="12">
        <tspan fill="#f43f5e" font-weight="bold">const</tspan> <tspan fill="#facc15">magicParty</tspan> = <tspan fill="#38bdf8">()</tspan> =&gt; {
      </text>

      <text x="32" y="60" font-family="'JetBrains Mono', monospace" font-size="12">
        <tspan fill="#4ade80">peerSocket</tspan>.<tspan fill="#c084fc">connect</tspan>(<tspan fill="#fb7185">'🚀 Room 42'</tspan>);
      </text>

      <text x="32" y="88" font-family="'JetBrains Mono', monospace" font-size="12">
        <tspan fill="#f43f5e" font-weight="bold">return</tspan> <tspan fill="#facc15">&lt;AwesomeApp /&gt;</tspan>;
      </text>

      <text x="18" y="116" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff">};</text>

      <!-- Cute Cartoon Cursor Hand -->
      <g transform="translate(230, 78)">
        <path d="M 10 20 L 10 0 L 16 0 L 16 12 L 22 12 L 22 14 L 28 14 L 28 26 Z" fill="#facc15" stroke="#000000" stroke-width="2" />
        <rect x="25" y="10" width="55" height="20" rx="6" fill="#f43f5e" stroke="#000000" stroke-width="2" />
        <text x="52" y="24" font-family="'Fredoka', sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Jaydip</text>
      </g>

      <!-- Terminal pill below -->
      <rect x="18" y="132" width="310" height="28" rx="6" fill="#18181b" stroke="#000000" stroke-width="2" />
      <text x="28" y="151" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80">✔ Connected to 4 peer consoles (0ms lag)</text>
    </g>
  </g>
</svg>
