<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Comic Shadow -->
  <rect x="14" y="14" width="576" height="356" rx="24" fill="#000000" />
  <rect x="8" y="8" width="576" height="356" rx="22" fill="#0b1329" stroke="#000000" stroke-width="5" />

  <!-- Window Header Bar (Chunky Green) -->
  <path d="M 8 30 C 8 18, 18 8, 30 8 L 562 8 C 574 8, 584 18, 584 30 L 584 52 L 8 52 Z" fill="#4ade80" stroke="#000000" stroke-width="5" />

  <circle cx="34" cy="30" r="9" fill="#f43f5e" stroke="#000000" stroke-width="3" />
  <circle cx="60" cy="30" r="9" fill="#facc15" stroke="#000000" stroke-width="3" />
  <circle cx="86" cy="30" r="9" fill="#38bdf8" stroke="#000000" stroke-width="3" />

  <rect x="180" y="18" width="240" height="26" rx="13" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="300" y="36" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    🚀 CryptoOrbit Moon-Station
  </text>

  <!-- Left: Cartoon Blasting Rocket & Coin Mascot -->
  <g transform="translate(30, 75)">
    <rect x="5" y="5" width="160" height="265" rx="18" fill="#000000" />
    <rect width="160" height="265" rx="16" fill="#fef08a" stroke="#000000" stroke-width="4.5" />

    <!-- Cute Smiling Gold Coin Mascot -->
    <circle cx="80" cy="55" r="32" fill="#facc15" stroke="#000000" stroke-width="4" />
    <circle cx="80" cy="55" r="24" fill="#fde047" stroke="#000000" stroke-width="2" />
    <text x="80" y="63" font-family="'Fredoka', sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">₿</text>
    <circle cx="70" cy="46" r="3" fill="#ffffff" />

    <!-- Rocket Blasting to the Moon -->
    <g transform="translate(45, 105)">
      <!-- Rocket Body -->
      <path d="M 35 10 C 35 10, 55 45, 50 85 L 20 85 C 15 45, 35 10, 35 10 Z" fill="#ffffff" stroke="#000000" stroke-width="3.5" />
      <circle cx="35" cy="48" r="9" fill="#38bdf8" stroke="#000000" stroke-width="2.5" />
      <!-- Rocket Fins -->
      <polygon points="20,70 5,85 20,85" fill="#f43f5e" stroke="#000000" stroke-width="3" />
      <polygon points="50,70 65,85 50,85" fill="#f43f5e" stroke="#000000" stroke-width="3" />
      <!-- Cartoon Rocket Flames -->
      <polygon points="25,87 35,120 45,87" fill="#facc15" stroke="#000000" stroke-width="2.5" />
      <polygon points="28,87 35,108 42,87" fill="#f43f5e" />
    </g>

    <!-- Sticker Banner -->
    <g transform="translate(15, 235) rotate(-4)">
      <rect width="130" height="28" rx="8" fill="#f43f5e" stroke="#000000" stroke-width="2.5" />
      <text x="65" y="19" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">TO THE MOON! 🌙</text>
    </g>
  </g>

  <!-- Right: Cartoon Trading Chart Panel -->
  <g transform="translate(210, 75)">
    <rect x="5" y="5" width="355" height="265" rx="18" fill="#000000" />
    <rect width="355" height="265" rx="16" fill="#ffffff" stroke="#000000" stroke-width="4.5" />

    <!-- Ticker Header -->
    <text x="20" y="34" font-family="'Fredoka', sans-serif" font-size="16" font-weight="bold" fill="#000000">
      BTC/USDT Super Pump 📈
    </text>
    <rect x="225" y="16" width="115" height="26" rx="8" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
    <text x="282" y="33" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">+$12,450 (+8.4%)</text>

    <!-- Candy Candlesticks -->
    <g transform="translate(20, 60)">
      <rect width="315" height="135" rx="12" fill="#f8fafc" stroke="#000000" stroke-width="2.5" />

      <!-- Candlestick Bars (Chunky Style) -->
      <!-- 1 Green -->
      <line x1="30" y1="80" x2="30" y2="120" stroke="#000000" stroke-width="2" />
      <rect x="23" y="90" width="14" height="24" rx="4" fill="#4ade80" stroke="#000000" stroke-width="2" />

      <!-- 2 Red -->
      <line x1="60" y1="90" x2="60" y2="125" stroke="#000000" stroke-width="2" />
      <rect x="53" y="95" width="14" height="20" rx="4" fill="#f43f5e" stroke="#000000" stroke-width="2" />

      <!-- 3 Green -->
      <line x1="90" y1="70" x2="90" y2="115" stroke="#000000" stroke-width="2" />
      <rect x="83" y="75" width="14" height="30" rx="4" fill="#4ade80" stroke="#000000" stroke-width="2" />

      <!-- 4 Green -->
      <line x1="120" y1="50" x2="120" y2="95" stroke="#000000" stroke-width="2" />
      <rect x="113" y="55" width="14" height="32" rx="4" fill="#4ade80" stroke="#000000" stroke-width="2" />

      <!-- 5 Green Big Breakout -->
      <line x1="150" y1="25" x2="150" y2="80" stroke="#000000" stroke-width="2" />
      <rect x="143" y="30" width="14" height="42" rx="4" fill="#4ade80" stroke="#000000" stroke-width="2" />

      <!-- 6 Red Consolidation -->
      <line x1="180" y1="35" x2="180" y2="75" stroke="#000000" stroke-width="2" />
      <rect x="173" y="40" width="14" height="25" rx="4" fill="#f43f5e" stroke="#000000" stroke-width="2" />

      <!-- 7 Green Rocket Candlestick -->
      <line x1="210" y1="15" x2="210" y2="60" stroke="#000000" stroke-width="2" />
      <rect x="203" y="18" width="14" height="38" rx="4" fill="#4ade80" stroke="#000000" stroke-width="2" />

      <!-- 8 Green Mega Candle -->
      <line x1="240" y1="8" x2="240" y2="55" stroke="#000000" stroke-width="2" />
      <rect x="233" y="12" width="14" height="35" rx="4" fill="#4ade80" stroke="#000000" stroke-width="2" />

      <!-- Bouncy Pink Trend Line -->
      <path d="M 25 105 Q 100 85, 150 45 T 260 20" fill="none" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
      <!-- Star on peak -->
      <polygon points="260,10 263,18 271,18 265,23 267,31 260,26 253,31 255,23 249,18 257,18" fill="#facc15" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- Bottom Action Pill -->
    <g transform="translate(20, 208)">
      <rect width="150" height="38" rx="10" fill="#4ade80" stroke="#000000" stroke-width="2.5" />
      <text x="75" y="24" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">BUY (Instant ⚡)</text>

      <rect x="165" y="0" width="150" height="38" rx="10" fill="#fbcfe8" stroke="#000000" stroke-width="2.5" />
      <text x="240" y="24" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">PROFIT: +42% 💎</text>
    </g>
  </g>
</svg>
