<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="greenCandleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg4)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="32" width="600" height="10" fill="#0f172a" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <text x="300" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    CryptoOrbit Pro // BTC/USDT Perpetual
  </text>
  <text x="490" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#10b981">
    $88,420.50 (+5.84%)
  </text>

  <!-- Left Chart Section -->
  <g transform="translate(20, 56)">
    <rect width="380" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <!-- Candlesticks and Grid -->
    <line x1="20" y1="40" x2="360" y2="40" stroke="#1e293b" stroke-dasharray="2 2" />
    <line x1="20" y1="90" x2="360" y2="90" stroke="#1e293b" stroke-dasharray="2 2" />
    <line x1="20" y1="140" x2="360" y2="140" stroke="#1e293b" stroke-dasharray="2 2" />
    <line x1="20" y1="190" x2="360" y2="190" stroke="#1e293b" stroke-dasharray="2 2" />

    <!-- Candlestick items -->
    <!-- 1 (Green) -->
    <line x1="45" y1="130" x2="45" y2="180" stroke="#10b981" stroke-width="1.5" />
    <rect x="38" y="145" width="14" height="25" fill="#10b981" rx="1" />

    <!-- 2 (Red) -->
    <line x1="75" y1="140" x2="75" y2="195" stroke="#ef4444" stroke-width="1.5" />
    <rect x="68" y="150" width="14" height="35" fill="#ef4444" rx="1" />

    <!-- 3 (Green) -->
    <line x1="105" y1="120" x2="105" y2="175" stroke="#10b981" stroke-width="1.5" />
    <rect x="98" y="130" width="14" height="35" fill="#10b981" rx="1" />

    <!-- 4 (Green) -->
    <line x1="135" y1="95" x2="135" y2="160" stroke="#10b981" stroke-width="1.5" />
    <rect x="128" y="105" width="14" height="40" fill="#10b981" rx="1" />

    <!-- 5 (Red) -->
    <line x1="165" y1="85" x2="165" y2="135" stroke="#ef4444" stroke-width="1.5" />
    <rect x="158" y="95" width="14" height="22" fill="#ef4444" rx="1" />

    <!-- 6 (Green) -->
    <line x1="195" y1="70" x2="195" y2="130" stroke="#10b981" stroke-width="1.5" />
    <rect x="188" y="80" width="14" height="42" fill="#10b981" rx="1" />

    <!-- 7 (Green) -->
    <line x1="225" y1="50" x2="225" y2="110" stroke="#10b981" stroke-width="1.5" />
    <rect x="218" y="60" width="14" height="38" fill="#10b981" rx="1" />

    <!-- 8 (Green breakout) -->
    <line x1="255" y1="35" x2="255" y2="90" stroke="#10b981" stroke-width="1.5" />
    <rect x="248" y="45" width="14" height="35" fill="#10b981" rx="1" />

    <!-- 9 (Red consolidation) -->
    <line x1="285" y1="40" x2="285" y2="85" stroke="#ef4444" stroke-width="1.5" />
    <rect x="278" y="48" width="14" height="20" fill="#ef4444" rx="1" />

    <!-- 10 (Green pump) -->
    <line x1="315" y1="20" x2="315" y2="70" stroke="#10b981" stroke-width="1.5" />
    <rect x="308" y="28" width="14" height="38" fill="#10b981" rx="1" filter="url(#glow4)" />

    <!-- Moving Average Lines -->
    <path d="M 40 160 Q 120 130, 200 90 T 320 40" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 40 175 Q 120 150, 200 120 T 320 65" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Right Order Book & Depth -->
  <g transform="translate(415, 56)">
    <rect width="165" height="230" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">ORDER BOOK</text>
    
    <!-- Sell asks (Red) -->
    <rect x="14" y="36" width="137" height="16" fill="#ef4444" fill-opacity="0.1" />
    <text x="18" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">88,450.00</text>
    <text x="145" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="end">1.42 BTC</text>

    <rect x="14" y="56" width="110" height="16" fill="#ef4444" fill-opacity="0.1" />
    <text x="18" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">88,435.50</text>
    <text x="145" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="end">0.89 BTC</text>

    <!-- Spread Divider -->
    <line x1="14" y1="84" x2="151" y2="84" stroke="#334155" />
    <text x="82" y="98" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#10b981" text-anchor="middle">88,420.50 ⚡</text>

    <!-- Buy bids (Green) -->
    <rect x="14" y="112" width="125" height="16" fill="#10b981" fill-opacity="0.1" />
    <text x="18" y="124" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">88,410.00</text>
    <text x="145" y="124" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="end">2.15 BTC</text>

    <rect x="14" y="132" width="90" height="16" fill="#10b981" fill-opacity="0.1" />
    <text x="18" y="144" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">88,390.20</text>
    <text x="145" y="144" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="end">0.65 BTC</text>

    <rect x="14" y="170" width="137" height="42" rx="6" fill="#1e293b" />
    <text x="24" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">ESTIMATED PNL</text>
    <text x="24" y="204" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#10b981">+$14,820.30</text>
  </g>

  <!-- Bottom Market Tickers Bar -->
  <g transform="translate(20, 300)">
    <rect width="560" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <text x="20" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f1f5f9">ETH: <tspan fill="#10b981">$3,840.10 (+4.1%)</tspan></text>
    <text x="210" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f1f5f9">SOL: <tspan fill="#10b981">$184.50 (+8.3%)</tspan></text>
    <text x="400" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f1f5f9">AVAX: <tspan fill="#10b981">$48.20 (+3.2%)</tspan></text>
  </g>
</svg>
