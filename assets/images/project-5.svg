<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="prodGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="prodGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="glow5" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg5)" stroke="#1e293b" stroke-width="2" />

  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0b0f19" />
  <rect x="0" y="32" width="600" height="10" fill="#0b0f19" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <text x="300" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    ShopStream // Headless Next.js Storefront
  </text>
  <rect x="495" y="12" width="85" height="20" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  <text x="537" y="25" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">🛒 Cart: 3 items</text>

  <!-- Left: Featured Product Card Mock -->
  <g transform="translate(30, 60)">
    <rect width="260" height="290" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <!-- Product visual area -->
    <rect x="12" y="12" width="236" height="140" rx="8" fill="url(#prodGrad1)" />
    <!-- Product Graphic (Futuristic Headphones) -->
    <circle cx="130" cy="75" r="32" fill="none" stroke="#fff" stroke-width="5" />
    <rect x="90" y="65" width="16" height="28" rx="6" fill="#60a5fa" />
    <rect x="154" y="65" width="16" height="28" rx="6" fill="#60a5fa" />
    <circle cx="130" cy="75" r="10" fill="#fff" opacity="0.3" />

    <text x="16" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">
      AuraPulse Spatial Headset
    </text>
    <text x="16" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">
      Active ANC • Hi-Res Wireless • 40h Battery
    </text>

    <!-- Star rating -->
    <text x="16" y="222" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f59e0b">
      ★★★★★ (4.9 / 1.2k reviews)
    </text>

    <text x="16" y="255" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#38bdf8">
      $349.00
    </text>
    <rect x="140" y="235" width="108" height="32" rx="6" fill="#2563eb" />
    <text x="194" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">
      Add to Bag
    </text>
  </g>

  <!-- Right: Secondary Product & Checkout Preview -->
  <g transform="translate(310, 60)">
    <!-- Top Mini Product -->
    <rect width="260" height="135" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
    <rect x="12" y="12" width="80" height="110" rx="8" fill="url(#prodGrad2)" />
    <circle cx="52" cy="65" r="20" fill="#a78bfa" opacity="0.5" />
    <text x="52" y="70" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">⚡</text>

    <text x="104" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">
      CyberKey Mech Board
    </text>
    <text x="104" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">
      Hot-swappable RGB OLED
    </text>
    <text x="104" y="85" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#a855f7">
      $189.00
    </text>
    <rect x="104" y="98" width="80" height="24" rx="4" fill="#7c3aed" />
    <text x="144" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">
      Quick Buy
    </text>

    <!-- Bottom Checkout Glass Card -->
    <g transform="translate(0, 150)">
      <rect width="260" height="140" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#64748b">
        CHECKOUT // STRIPE EMBED
      </text>

      <rect x="16" y="38" width="228" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="28" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">•••• •••• •••• 4242</text>
      <text x="210" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">VALID</text>

      <rect x="16" y="82" width="228" height="38" rx="6" fill="#10b981" />
      <text x="130" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">
        Pay $538.00 (Instant Auth)
      </text>
    </g>
  </g>
</svg>
