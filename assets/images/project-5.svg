<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Comic Shadow -->
  <rect x="14" y="14" width="576" height="356" rx="24" fill="#000000" />
  <rect x="8" y="8" width="576" height="356" rx="22" fill="#18181b" stroke="#000000" stroke-width="5" />

  <!-- Window Header Bar (Chunky Cyan) -->
  <path d="M 8 30 C 8 18, 18 8, 30 8 L 562 8 C 574 8, 584 18, 584 30 L 584 52 L 8 52 Z" fill="#38bdf8" stroke="#000000" stroke-width="5" />

  <circle cx="34" cy="30" r="9" fill="#f43f5e" stroke="#000000" stroke-width="3" />
  <circle cx="60" cy="30" r="9" fill="#facc15" stroke="#000000" stroke-width="3" />
  <circle cx="86" cy="30" r="9" fill="#4ade80" stroke="#000000" stroke-width="3" />

  <rect x="180" y="18" width="240" height="26" rx="13" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="300" y="36" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    🛍️ ShopStream Candy Store
  </text>

  <!-- Left: Featured Product (Cool Cartoon Sneaker with speed lines) -->
  <g transform="translate(30, 75)">
    <rect x="5" y="5" width="250" height="265" rx="18" fill="#000000" />
    <rect width="250" height="265" rx="16" fill="#fbcfe8" stroke="#000000" stroke-width="4.5" />

    <!-- Comic Badge -->
    <g transform="translate(15, 15) rotate(-6)">
      <rect width="90" height="26" rx="8" fill="#facc15" stroke="#000000" stroke-width="2.5" />
      <text x="45" y="18" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">HOT DROP 🔥</text>
    </g>

    <!-- Cartoon Sneaker Illustration -->
    <g transform="translate(25, 55)">
      <!-- Speed lines -->
      <line x1="15" y1="50" x2="45" y2="50" stroke="#000000" stroke-width="3" stroke-linecap="round" />
      <line x1="5" y1="70" x2="35" y2="70" stroke="#000000" stroke-width="3" stroke-linecap="round" />
      
      <!-- Sneaker Sole -->
      <path d="M 35 110 L 175 110 C 185 110, 195 100, 185 85 L 170 85 L 160 50 L 115 50 L 100 85 L 45 85 C 35 85, 30 95, 35 110 Z" fill="#ffffff" stroke="#000000" stroke-width="4.5" />
      <!-- Sneaker Upper (Punchy Pink & Cyan) -->
      <path d="M 45 85 L 100 85 L 115 50 L 160 50 L 170 85 Z" fill="#f43f5e" stroke="#000000" stroke-width="3.5" />
      <circle cx="130" cy="70" r="10" fill="#facc15" stroke="#000000" stroke-width="2" />
      <text x="130" y="74" font-family="'Fredoka', sans-serif" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">⚡</text>
      <!-- Laces -->
      <line x1="120" y1="58" x2="145" y2="58" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="125" y1="65" x2="148" y2="65" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Product Info -->
    <text x="20" y="180" font-family="'Fredoka', sans-serif" font-size="16" font-weight="bold" fill="#000000">
      Air Cyber Retro Kicks
    </text>
    <text x="20" y="200" font-family="'Fredoka', sans-serif" font-size="12" fill="#713f12">
      ⭐⭐⭐⭐⭐ (2,400 Reviews)
    </text>

    <!-- Price and Add to Cart -->
    <g transform="translate(18, 215)">
      <text x="5" y="26" font-family="'Fredoka', sans-serif" font-size="22" font-weight="bold" fill="#000000">
        $189
      </text>
      <rect x="95" y="0" width="120" height="38" rx="10" fill="#000000" />
      <rect x="92" y="-3" width="120" height="38" rx="10" fill="#facc15" stroke="#000000" stroke-width="3" />
      <text x="152" y="22" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">
        ADD TO BAG 🛒
      </text>
    </g>
  </g>

  <!-- Right: Cartoon Checkout & Cart Counter -->
  <g transform="translate(305, 75)">
    <!-- Cart Counter Card -->
    <rect x="5" y="5" width="260" height="120" rx="18" fill="#000000" />
    <rect width="260" height="120" rx="16" fill="#fef08a" stroke="#000000" stroke-width="4.5" />

    <text x="20" y="32" font-family="'Fredoka', sans-serif" font-size="15" font-weight="bold" fill="#000000">
      Instant Checkout ⚡
    </text>
    <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#713f12">
      Next.js Server Action + Stripe 💳
    </text>

    <rect x="20" y="68" width="220" height="36" rx="10" fill="#4ade80" stroke="#000000" stroke-width="3" />
    <text x="130" y="91" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
      1-CLICK BUY (0.3s) ✨
    </text>

    <!-- Bottom Confetti / Discount Card -->
    <g transform="translate(0, 140)">
      <rect x="5" y="5" width="260" height="125" rx="18" fill="#000000" />
      <rect width="260" height="125" rx="16" fill="#bae6fd" stroke="#000000" stroke-width="4.5" />

      <text x="20" y="32" font-family="'Fredoka', sans-serif" font-size="14" font-weight="bold" fill="#000000">
        🎉 Promo Applied: WOW100
      </text>
      <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#0369a1">
        Free Worldwide Express Shipping!
      </text>

      <g transform="translate(20, 68)">
        <rect width="220" height="38" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2.5" />
        <text x="15" y="24" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#15803d">
          ✔ 100/100 Lighthouse Performance
        </text>
      </g>
    </g>
  </g>
</svg>
