<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1e" />
      <stop offset="100%" stop-color="#030511" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#bg3)" stroke="#1e293b" stroke-width="2" />

  <!-- App Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="32" width="600" height="10" fill="#0f172a" />
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />

  <text x="300" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
    NexusAI // Multi-Agent Pipeline Graph
  </text>
  <rect x="500" y="12" width="75" height="20" rx="10" fill="url(#purpleGrad)" />
  <text x="537" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">⚡ LIVE RUN</text>

  <!-- Left: Agent Workflow Graph -->
  <g transform="translate(20, 60)">
    <!-- Node 1: Ingestion -->
    <rect x="10" y="60" width="130" height="60" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="22" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">1. Vector Embed</text>
    <text x="22" y="103" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">ada-002 • 1536d</text>

    <!-- Connector 1 -> 2 -->
    <path d="M 140 90 L 190 90" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="165" cy="90" r="3" fill="#38bdf8" filter="url(#glow3)" />

    <!-- Node 2: Reasoning Router -->
    <rect x="190" y="40" width="150" height="100" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" filter="url(#glow3)" />
    <text x="205" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#c084fc">2. LLM Planner</text>
    <text x="205" y="88" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Model: Gemini 2.5 Flash</text>
    <rect x="205" y="102" width="70" height="18" rx="4" fill="#8b5cf6" opacity="0.3" />
    <text x="240" y="114" font-family="'JetBrains Mono', monospace" font-size="8" fill="#c084fc" text-anchor="middle">Thinking...</text>

    <!-- Connector 2 -> 3 (Top Branch) -->
    <path d="M 340 70 L 390 40" stroke="#8b5cf6" stroke-width="2" />
    <!-- Connector 2 -> 4 (Bottom Branch) -->
    <path d="M 340 110 L 390 140" stroke="#8b5cf6" stroke-width="2" />

    <!-- Node 3: Tool Execution (Code Interpreter) -->
    <rect x="390" y="15" width="160" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="405" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#34d399">3a. Code Sandbox</text>
    <text x="405" y="55" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Status: Success (0.4s)</text>

    <!-- Node 4: Synthesis -->
    <rect x="390" y="115" width="160" height="55" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="405" y="138" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">3b. Web Retriever</text>
    <text x="405" y="155" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">8 sources validated</text>
  </g>

  <!-- Bottom: Streaming Output Console Card -->
  <g transform="translate(20, 240)">
    <rect width="560" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <text x="16" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">AGENT GENERATION STREAM</text>
    <circle cx="530" cy="18" r="4" fill="#10b981" filter="url(#glow3)" />
    <text x="510" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">62 tps</text>

    <!-- Chat Prompt / Output bubbles -->
    <rect x="16" y="35" width="528" height="34" rx="6" fill="#1e293b" />
    <text x="28" y="56" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">
      &gt; User: "Analyze quarterly user retention trends and generate SQL query"
    </text>

    <text x="16" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f1f5f9">
      🤖 Agent: Analyzing 45,000 cohort events... Identified 32% retention uplift in Cohort Q3.
    </text>
    <text x="16" y="108" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a855f7">
      SELECT cohort_month, COUNT(DISTINCT user_id) as retained_users FROM events GROUP BY 1;
    </text>
  </g>
</svg>
