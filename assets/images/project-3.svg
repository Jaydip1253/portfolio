<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Comic Shadow -->
  <rect x="14" y="14" width="576" height="356" rx="24" fill="#000000" />
  <rect x="8" y="8" width="576" height="356" rx="22" fill="#312e81" stroke="#000000" stroke-width="5" />

  <!-- Window Header Bar (Chunky Purple) -->
  <path d="M 8 30 C 8 18, 18 8, 30 8 L 562 8 C 574 8, 584 18, 584 30 L 584 52 L 8 52 Z" fill="#c084fc" stroke="#000000" stroke-width="5" />

  <circle cx="34" cy="30" r="9" fill="#f43f5e" stroke="#000000" stroke-width="3" />
  <circle cx="60" cy="30" r="9" fill="#facc15" stroke="#000000" stroke-width="3" />
  <circle cx="86" cy="30" r="9" fill="#4ade80" stroke="#000000" stroke-width="3" />

  <rect x="180" y="18" width="240" height="26" rx="13" fill="#ffffff" stroke="#000000" stroke-width="3" />
  <text x="300" y="36" font-family="'Fredoka', sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">
    🤖 Nexus AI Brain Box
  </text>

  <!-- Left: Cute Floating AI Companion Robot -->
  <g transform="translate(45, 80)">
    <!-- Antenna -->
    <line x1="85" y1="20" x2="85" y2="-5" stroke="#000000" stroke-width="4" />
    <circle cx="85" cy="-8" r="8" fill="#facc15" stroke="#000000" stroke-width="3" />
    <!-- Electric spark -->
    <path d="M 85 -22 L 92 -15 L 85 -18 L 88 -10" stroke="#facc15" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Robot Head Body -->
    <rect x="15" y="25" width="140" height="135" rx="36" fill="#f0abfc" stroke="#000000" stroke-width="5" />
    
    <!-- Face Screen -->
    <rect x="30" y="45" width="110" height="75" rx="20" fill="#0f172a" stroke="#000000" stroke-width="4" />

    <!-- Big Cute Glowing Eyes -->
    <circle cx="60" cy="80" r="14" fill="#38bdf8" />
    <circle cx="56" cy="76" r="4.5" fill="#ffffff" />
    <circle cx="110" cy="80" r="14" fill="#38bdf8" />
    <circle cx="106" cy="76" r="4.5" fill="#ffffff" />
    
    <!-- Cheerful Beep Mouth -->
    <path d="M 75 102 Q 85 110 95 102" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Cute Float Jet Pack Body -->
    <rect x="55" y="165" width="60" height="40" rx="14" fill="#a855f7" stroke="#000000" stroke-width="4" />
    <!-- Jet flames -->
    <polygon points="65,205 75,230 85,205" fill="#facc15" stroke="#000000" stroke-width="2" />
    <polygon points="85,205 95,230 105,205" fill="#f43f5e" stroke="#000000" stroke-width="2" />

    <!-- Comic Badge -->
    <g transform="translate(15, 235)">
      <rect width="140" height="34" rx="10" fill="#facc15" stroke="#000000" stroke-width="3" />
      <text x="70" y="22" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">🧠 IQ 9000 AGENT</text>
    </g>
  </g>

  <!-- Right: Cartoon Multi-Agent Pipeline & Speech Bubbles -->
  <g transform="translate(230, 75)">
    <!-- Main Box -->
    <rect x="5" y="5" width="335" height="265" rx="18" fill="#000000" />
    <rect width="335" height="265" rx="16" fill="#ffffff" stroke="#000000" stroke-width="4.5" />

    <text x="20" y="32" font-family="'Fredoka', sans-serif" font-size="15" font-weight="bold" fill="#000000">
      Multi-Agent Pipeline Graph ⚡
    </text>

    <!-- Node 1: User Request Bubble -->
    <g transform="translate(20, 50)">
      <rect width="295" height="42" rx="12" fill="#fef08a" stroke="#000000" stroke-width="2.5" />
      <text x="14" y="26" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000">
        💬 User: "Generate summary &amp; code diagram!"
      </text>
    </g>

    <!-- Flow Arrow -->
    <path d="M 165 95 L 165 115" stroke="#000000" stroke-width="4" marker-end="url(#arrow)" />

    <!-- 3 Cartoon Pipeline Steps -->
    <g transform="translate(20, 115)">
      <!-- Step A -->
      <rect x="0" y="0" width="88" height="58" rx="10" fill="#bae6fd" stroke="#000000" stroke-width="2.5" />
      <text x="44" y="25" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">1. RETRIEVE</text>
      <text x="44" y="44" font-family="'Fredoka', sans-serif" font-size="9" fill="#0369a1" text-anchor="middle">📚 10k Docs</text>

      <!-- Step B (Active) -->
      <rect x="103" y="0" width="88" height="58" rx="10" fill="#fbcfe8" stroke="#000000" stroke-width="3" />
      <text x="147" y="25" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">2. REASON</text>
      <text x="147" y="44" font-family="'Fredoka', sans-serif" font-size="9" fill="#be185d" text-anchor="middle">✨ Thinking...</text>

      <!-- Step C -->
      <rect x="206" y="0" width="88" height="58" rx="10" fill="#bbf7d0" stroke="#000000" stroke-width="2.5" />
      <text x="250" y="25" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">3. SOLVE</text>
      <text x="250" y="44" font-family="'Fredoka', sans-serif" font-size="9" fill="#15803d" text-anchor="middle">🎯 Done 0.2s</text>
    </g>

    <!-- Agent Output Box -->
    <g transform="translate(20, 190)">
      <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#000000" stroke-width="2.5" />
      <text x="14" y="24" font-family="'Fredoka', sans-serif" font-size="11" font-weight="bold" fill="#15803d">
        🎉 Agent: "Boom! Query optimized by 85%!"
      </text>
      <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">
        SELECT * FROM victory WHERE state = 'awesome';
      </text>
    </g>
  </g>
</svg>
